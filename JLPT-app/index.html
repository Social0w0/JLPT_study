<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT 단어 학습</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff;
    --card: #ffffff;
    --primary: #3b6cf7;
    --primary-dark: #2550d4;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(59,108,247,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; }

  /* START SCREEN */
  .start-card {
    background: var(--card);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: var(--shadow);
    text-align: center;
    width: 100%;
  }
  .start-icon { font-size: 56px; margin-bottom: 16px; }
  .start-title { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .start-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
  .level-select {
    display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center;
  }
  .level-btn {
    padding: 6px 16px; border-radius: 20px; border: 2px solid var(--border);
    background: transparent; cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--muted); transition: all 0.2s;
  }
  .level-btn.active {
    border-color: var(--primary); color: var(--primary); background: #eff4ff;
  }
  .count-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
  .count-label { font-size: 15px; color: var(--text); font-weight: 500; }
  .count-input {
    width: 80px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px;
    font-size: 18px; font-weight: 700; text-align: center; color: var(--text);
    outline: none; transition: border-color 0.2s;
  }
  .count-input:focus { border-color: var(--primary); }
  .btn-primary {
    width: 100%; padding: 16px; background: var(--primary); color: white;
    border: none; border-radius: 14px; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,108,247,0.35); }
  .btn-primary:active { transform: translateY(0); }
  .vocab-count { font-size: 13px; color: var(--muted); margin-top: 16px; }

  /* QUIZ SCREEN */
  .quiz-header { width: 100%; margin-bottom: 20px; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.4s ease; }
  .progress-fill.wrong-mode { background: var(--wrong); }

  .quiz-card {
    background: var(--card); border-radius: 24px; padding: 40px 32px 32px;
    box-shadow: var(--shadow); width: 100%; text-align: center;
  }
  .quiz-mode-badge {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700; margin-bottom: 20px;
    background: #eff4ff; color: var(--primary);
  }
  .quiz-mode-badge.retry { background: #fff7ed; color: #f97316; }
  .quiz-word {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 64px; font-weight: 700; color: var(--text);
    margin-bottom: 8px; line-height: 1.1;
  }
  .quiz-furigana { font-size: 16px; color: var(--muted); margin-bottom: 8px; font-family: 'Noto Sans JP', sans-serif; }
  .quiz-instruction { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    padding: 14px 20px; border: 2px solid var(--border); border-radius: 14px;
    background: white; font-size: 16px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
    font-family: inherit; text-align: left;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #f5f8ff; }
  .choice-btn .num {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--muted); flex-shrink: 0;
  }
  .choice-btn.correct { border-color: var(--correct); background: #f0fdf4; color: var(--correct); }
  .choice-btn.correct .num { background: var(--correct); color: white; }
  .choice-btn.wrong { border-color: var(--wrong); background: #fef2f2; color: var(--wrong); }
  .choice-btn.wrong .num { background: var(--wrong); color: white; }
  .choice-btn:disabled { cursor: default; }

  .result-msg {
    margin-top: 20px; padding: 12px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600; display: none;
  }
  .result-msg.show { display: block; }
  .result-msg.correct-msg { background: #f0fdf4; color: var(--correct); }
  .result-msg.wrong-msg { background: #fef2f2; color: var(--wrong); }
  .next-btn {
    margin-top: 16px; width: 100%; padding: 14px; background: var(--primary);
    color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; display: none; font-family: inherit;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--primary-dark); }

  /* RESULT SCREEN */
  .result-card {
    background: var(--card); border-radius: 24px; padding: 48px 40px;
    box-shadow: var(--shadow); width: 100%; text-align: center;
  }
  .result-icon { font-size: 60px; margin-bottom: 16px; }
  .result-title { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .result-sub { font-size: 15px; color: var(--muted); margin-bottom: 32px; }
  .score-row { display: flex; gap: 32px; justify-content: center; margin-bottom: 36px; }
  .score-box { text-align: center; }
  .score-num { font-size: 48px; font-weight: 700; line-height: 1; }
  .score-num.c { color: var(--correct); }
  .score-num.w { color: var(--wrong); }
  .score-lbl { font-size: 14px; color: var(--muted); margin-top: 4px; font-weight: 500; }

  /* COMPLETE SCREEN */
  .complete-card {
    background: var(--card); border-radius: 24px; padding: 48px 40px;
    box-shadow: var(--shadow); width: 100%; text-align: center;
  }

  @keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  .screen.active { animation: fadeIn 0.3s ease; }
  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .choice-btn.correct { animation: pop 0.3s ease; }
</style>
</head>
<body>

<!-- START -->
<div class="screen active" id="screen-start">
  <div class="start-card">
    <div class="start-icon">📚</div>
    <div class="start-title">미규 언니의 JLPT 단어 학습</div>
    <div class="start-sub">단어를 보고 올바른 한국어 해석을 고르세요</div>
    <div class="level-select" id="level-select">
      <button class="level-btn active" data-level="ALL">전체</button>
      <button class="level-btn" data-level="N5">N5</button>
      <button class="level-btn" data-level="N4">N4</button>
      <button class="level-btn" data-level="N3">N3</button>
      <button class="level-btn" data-level="N2">N2</button>
      <button class="level-btn" data-level="N1">N1</button>
    </div>
    <div class="count-row">
      <span class="count-label">문제 수</span>
      <input class="count-input" id="count-input" type="number" value="10" min="1" max="50">
      <span class="count-label">문제</span>
    </div>
    <button class="btn-primary" id="start-btn">시작하기</button>
    <div class="vocab-count" id="vocab-count">전체 5431개 단어</div>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <div class="progress-row">
      <span class="progress-label" id="progress-label">1 / 10</span>
      <span class="progress-label" id="score-label">✓ 0 &nbsp; ✗ 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="quiz-card">
    <div class="quiz-mode-badge" id="mode-badge">문제</div>
    <div class="quiz-word" id="quiz-word">—</div>
    <div class="quiz-furigana" id="quiz-furigana"></div>
    <div class="quiz-instruction">다음 중 올바른 해석을 고르세요.</div>
    <div class="choices" id="choices"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="next-btn" id="next-btn">다음</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="result-card">
    <div class="result-icon">🏆</div>
    <div class="result-title">학습 완료!</div>
    <div class="result-sub" id="result-sub">10문제 중 7문제를 맞혔어요.</div>
    <div class="score-row">
      <div class="score-box"><div class="score-num c" id="r-correct">0</div><div class="score-lbl">정답</div></div>
      <div class="score-box"><div class="score-num w" id="r-wrong">0</div><div class="score-lbl">오답</div></div>
    </div>
    <button class="btn-primary" id="retry-btn">오답 문제 다시 풀기</button>
    <button class="btn-primary" id="home-btn" style="margin-top:12px;background:#f1f5f9;color:var(--text);">처음으로</button>
  </div>
</div>

<!-- COMPLETE -->
<div class="screen" id="screen-complete">
  <div class="complete-card">
    <div class="result-icon">🎉</div>
    <div class="result-title">축하합니다!</div>
    <div class="result-sub">모든 오답 문제를 맞혔어요!</div>
    <button class="btn-primary" id="home-btn2" style="margin-top:24px;">학습 종료</button>
  </div>
</div>

let selectedLevel = 'ALL';
let pool = [];
let questions = [];
let current = 0;
let correctCount = 0;
let wrongItems = [];
let isRetryMode = false;
let answered = false;

// Level select
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedLevel = btn.dataset.level;
    updateVocabCount();
  });
});

function updateVocabCount() {
  const filtered = selectedLevel === 'ALL' ? VOCAB : VOCAB.filter(v => v.l === selectedLevel);
  document.getElementById('vocab-count').textContent = `${selectedLevel === 'ALL' ? '전체' : selectedLevel} ${filtered.length.toLocaleString()}개 단어`;
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function getPool() {
  return selectedLevel === 'ALL' ? [...VOCAB] : VOCAB.filter(v => v.l === selectedLevel);
}

function buildQuestions(items, count) {
  const shuffled = shuffle([...items]).slice(0, count);
  return shuffled.map(item => {
    const others = VOCAB.filter(v => v.k !== item.k);
    const distractors = shuffle(others).slice(0, 3).map(v => v.k);
    const choices = shuffle([item.k, ...distractors]);
    return { word: item.w, furigana: item.f, answer: item.k, choices };
  });
}

document.getElementById('start-btn').addEventListener('click', () => {
  const count = Math.min(50, Math.max(1, parseInt(document.getElementById('count-input').value) || 10));
  pool = getPool();
  if (pool.length === 0) { alert('해당 레벨 단어가 없습니다.'); return; }
  questions = buildQuestions(pool, Math.min(count, pool.length));
  current = 0; correctCount = 0; wrongItems = []; isRetryMode = false;
  showScreen('screen-quiz');
  renderQuestion();
});

document.getElementById('next-btn').addEventListener('click', () => {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
});

document.getElementById('retry-btn').addEventListener('click', () => {
  if (wrongItems.length === 0) { showScreen('screen-complete'); return; }
  questions = buildQuestions(wrongItems.map(w => VOCAB.find(v => v.w === w.word) || w), wrongItems.length);
  current = 0; correctCount = 0; wrongItems = []; isRetryMode = true;
  showScreen('screen-quiz');
  renderQuestion();
});

document.getElementById('home-btn').addEventListener('click', () => showScreen('screen-start'));
document.getElementById('home-btn2').addEventListener('click', () => showScreen('screen-start'));

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;
  const pct = (current / total) * 100;

  document.getElementById('progress-label').textContent = `${current + 1} / ${total}`;
  document.getElementById('score-label').innerHTML = `✓ ${correctCount} &nbsp; ✗ ${current - correctCount}`;
  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'progress-fill' + (isRetryMode ? ' wrong-mode' : '');

  const badge = document.getElementById('mode-badge');
  badge.textContent = isRetryMode ? '문제 (오답 재도전)' : '문제';
  badge.className = 'quiz-mode-badge' + (isRetryMode ? ' retry' : '');

  document.getElementById('quiz-word').textContent = q.word;
  document.getElementById('quiz-furigana').textContent = q.furigana !== q.word ? q.furigana : '';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="num">${i + 1}</span> ${choice}`;
    btn.addEventListener('click', () => onAnswer(btn, choice, q));
    choicesEl.appendChild(btn);
  });

  document.getElementById('result-msg').className = 'result-msg';
  document.getElementById('result-msg').textContent = '';
  document.getElementById('next-btn').className = 'next-btn';
}

function onAnswer(btn, choice, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b => b.disabled = true);

  if (choice === q.answer) {
    btn.classList.add('correct');
    correctCount++;
    const msg = document.getElementById('result-msg');
    msg.className = 'result-msg show correct-msg';
    msg.textContent = '✓ 정답입니다!';
  } else {
    btn.classList.add('wrong');
    // highlight correct
    allBtns.forEach(b => {
      if (b.textContent.trim().includes(q.answer)) b.classList.add('correct');
    });
    const msg = document.getElementById('result-msg');
    msg.className = 'result-msg show wrong-msg';
    msg.textContent = `✗ 오답입니다! 정답은 "${q.answer}" 입니다.`;
    wrongItems.push(q);
  }

  document.getElementById('score-label').innerHTML = `✓ ${correctCount} &nbsp; ✗ ${current + 1 - correctCount}`;
  document.getElementById('next-btn').className = 'next-btn show';
}

function showResult() {
  document.getElementById('r-correct').textContent = correctCount;
  document.getElementById('r-wrong').textContent = questions.length - correctCount;
  document.getElementById('result-sub').textContent = `${questions.length}문제 중 ${correctCount}문제를 맞혔어요.`;
  const retryBtn = document.getElementById('retry-btn');
  if (wrongItems.length === 0) {
    retryBtn.textContent = '🎉 모두 맞혔어요!';
    retryBtn.disabled = true;
    retryBtn.style.opacity = '0.5';
  } else {
    retryBtn.textContent = `오답 ${wrongItems.length}문제 다시 풀기`;
    retryBtn.disabled = false;
    retryBtn.style.opacity = '1';
  }
  showScreen('screen-result');
}

updateVocabCount();
</script>
</body>
</html>
